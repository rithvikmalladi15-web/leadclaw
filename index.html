<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LeadClaw: Recover wasted lead spend</title>
<meta name="color-scheme" content="dark light">
<script>try{var __t=localStorage.getItem('lc_theme')}catch(e){}document.documentElement.setAttribute('data-theme',__t==='dark'?'dark':'light')</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:dark;
  --bg:#05070d; --bg2:#090d18; --card:#0d1322; --card2:#131b30; --line:#1b2540; --line2:#28365a;
  --text:#f4f7ff; --muted:#8e9bba; --dim:#5b688a;
  --blue:#3b82f6; --blue-d:#2563eb; --blue-l:#8bb8ff; --green:#22c55e; --red:#f87171; --amber:#fbbf24;
  --mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
  --sans:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --r:14px;
}
*,*::before,*::after{box-sizing:border-box}
html{height:100%}
body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font:15px/1.55 var(--sans);-webkit-font-smoothing:antialiased;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
button,textarea,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px;border-radius:6px}

.top{display:flex;align-items:center;justify-content:space-between;gap:16px;max-width:1180px;margin:0 auto;padding:20px 24px}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:17px;letter-spacing:-.01em}
.logo{width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,var(--blue),#6366f1);display:grid;place-items:center}
.logo svg{width:17px;height:17px}
.ledger{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:7px 8px 7px 16px}
.ledger small{color:var(--muted);font-size:13px}
.ledger b{font:600 15px var(--mono);color:#fff;min-width:74px;text-align:right}

main{max-width:1180px;margin:0 auto;padding:8px 24px 56px;display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:22px;align-items:start}
@media(max-width:900px){main{grid-template-columns:1fr}.top{padding:16px}main{padding:8px 16px 40px}}
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:26px}
h1{font-size:26px;line-height:1.2;letter-spacing:-.02em;margin:0 0 6px}
.sub{color:var(--muted);margin:0 0 26px;max-width:52ch}
.field{margin-bottom:22px}
.field>label,.lbl{display:block;font-weight:600;font-size:13.5px;margin-bottom:9px}
.lbl span{color:var(--dim);font-weight:400;margin-left:6px}

.seg{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:4px}
.seg button{border:0;background:transparent;padding:10px 6px;border-radius:9px;color:var(--muted);font-weight:500;cursor:pointer;transition:background .15s,color .15s}
.seg button:hover{color:var(--text)}
.seg button[aria-checked=true]{background:var(--blue);color:#fff}
@media(max-width:480px){.seg{grid-template-columns:repeat(2,1fr)}}

.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line2);background:transparent;color:var(--muted);padding:6px 13px;border-radius:999px;font-size:13px;cursor:pointer;transition:all .15s}
.chip:hover{border-color:var(--blue);color:var(--text)}
.chip[aria-pressed=true]{background:rgba(59,130,246,.14);border-color:var(--blue);color:#9cc2ff}

textarea{width:100%;min-height:128px;resize:vertical;background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:13px 14px;line-height:1.55}
textarea::placeholder{color:var(--dim)}
#transcript{font:13px/1.6 var(--mono);min-height:110px}
.costrow{display:flex;gap:10px;align-items:stretch;flex-wrap:wrap}.costrow .cost{width:150px;flex:none}
.est{display:inline-flex;align-items:center;gap:8px;padding:11px 16px;border-radius:12px;border:1px solid var(--line2);background:rgba(59,130,246,.10);color:var(--blue-l);font-weight:600;font-size:13.5px;cursor:pointer;white-space:nowrap}
.est:hover{border-color:var(--blue);background:rgba(59,130,246,.18)}
.row{display:grid;grid-template-columns:1fr 150px;gap:12px}
.cost{position:relative}
.cost span{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--dim);font-family:var(--mono)}
.cost input{width:100%;background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:12px 12px 12px 28px;font-family:var(--mono);height:100%}

.drop{border:1.5px dashed var(--line2);border-radius:12px;padding:22px;text-align:center;background:var(--bg2);cursor:pointer}
.drop p{margin:0;color:var(--muted);font-size:13.5px}.drop p b{color:var(--text);font-weight:500}
.files{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.file{display:flex;align-items:center;gap:10px;background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.file .ico{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;font:600 10px var(--mono);background:rgba(59,130,246,.14);color:#9cc2ff}
.file .nm{flex:1;min-width:0;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.file .sz{font:12px var(--mono);color:var(--dim)}
.file button{border:0;background:none;color:var(--dim);cursor:pointer;font-size:18px}

.go{width:100%;display:flex;align-items:center;justify-content:center;gap:10px;border:0;cursor:pointer;background:linear-gradient(180deg,var(--blue),var(--blue-d));color:#fff;font-weight:600;font-size:15.5px;padding:14px;border-radius:12px;box-shadow:0 6px 20px rgba(59,130,246,.28)}
.go:disabled{opacity:.45;cursor:not-allowed;box-shadow:none}
.spin{width:16px;height:16px;border:2px solid rgba(255,255,255,.35);border-top-color:#fff;border-radius:50%;animation:rot .7s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}

.result{position:sticky;top:16px;min-height:420px;display:flex;flex-direction:column}
.empty{margin:auto;text-align:center;max-width:300px;color:var(--muted);padding:30px 0}
.empty .ring{width:54px;height:54px;border-radius:50%;border:1px dashed var(--line2);margin:0 auto 14px;display:grid;place-items:center;color:var(--dim)}
.empty h3{margin:0 0 4px;color:var(--text);font-size:16px}.empty p{margin:0;font-size:13.5px}
.steps{display:flex;flex-direction:column;gap:14px;margin:6px 0 22px}
.step{display:flex;align-items:center;gap:12px;color:var(--dim);font-size:14px}
.step i{width:20px;height:20px;border-radius:50%;border:1.5px solid var(--line2);display:grid;place-items:center;font-style:normal;font-size:11px}
.step.on{color:var(--text)}.step.on i{border-color:var(--blue);border-top-color:transparent;animation:rot .8s linear infinite}
.step.done{color:var(--muted)}.step.done i{background:var(--blue);border-color:var(--blue);color:#fff}
.sk{height:12px;border-radius:6px;margin-bottom:10px;background:linear-gradient(90deg,var(--card2) 25%,#202a47 50%,var(--card2) 75%);background-size:200% 100%;animation:sh 1.3s infinite}
@keyframes sh{to{background-position:-200% 0}}

.verdict{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.badge{display:inline-flex;align-items:center;gap:8px;padding:7px 13px;border-radius:999px;font-weight:600;font-size:13.5px}
.badge.ok{background:rgba(34,197,94,.13);color:var(--green);border:1px solid rgba(34,197,94,.35)}
.badge.no{background:rgba(248,113,113,.12);color:var(--red);border:1px solid rgba(248,113,113,.35)}
.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px}
.fact{background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.fact small{display:block;color:var(--dim);font-size:12px}.fact b{font:600 15px var(--mono)}
.fact b.g{color:var(--blue-l)}
.claim{position:relative;background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:16px;font:13px/1.7 var(--mono);color:#cdd6ea;white-space:pre-wrap;max-height:300px;overflow:auto;margin-bottom:14px}
.why{background:rgba(248,113,113,.07);border:1px solid rgba(248,113,113,.25);border-radius:12px;padding:15px 16px;margin-bottom:14px;color:#f3c4c4}
.why b{color:var(--red)}
.actions{display:flex;gap:10px;flex-wrap:wrap}
.btn{flex:1;min-width:150px;display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 14px;border-radius:11px;font-weight:600;cursor:pointer;border:1px solid var(--line2);background:var(--card2)}
.btn.primary{background:#fff;border-color:#fff;color:#05070d}
.btn.copied{background:rgba(34,197,94,.14);border-color:var(--green);color:var(--green)}
.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);background:var(--card2);border:1px solid var(--line2);padding:10px 16px;border-radius:10px;opacity:0;pointer-events:none;transition:all .2s;font-size:14px;z-index:9}
.toast.show{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body>
<header class="top">
  <div class="brand"><div class="logo"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4c3 3 4 8 3 16M11 4c3 3 4 8 3 16M17 4c3 3 4 8 3 16"/></svg></div>LeadClaw</div>
  <div class="ledger"><small>Recovered</small><b id="total">\$0.00</b></div>
</header>

<main>
  <section class="panel">
    <h1>Lead credit request</h1>
    <p class="sub">Enter the details below. We review them against the platform's refund policy and prepare your claim if the lead qualifies.</p>

    <div class="field">
      <span class="lbl" id="plbl">Lead platform</span>
      <div class="seg" role="radiogroup" aria-labelledby="plbl" id="platforms"></div>
    </div>

    <div class="field">
      <span class="lbl">What went wrong?<span>tap to auto-fill reason</span></span>
      <div class="chips" id="chips"></div>
    </div>

    <div class="field">
      <label for="notes">Refund reason</label>
      <textarea id="notes" placeholder="e.g. Called twice, number was disconnected. Lead asked for a roof repair in a ZIP we don't serve."></textarea>
    </div>

    <div class="field">
      <label for="transcript">Transcript<span style="color:var(--dim);font-weight:400;margin-left:6px">optional</span></label>
      <textarea id="transcript" placeholder="Paste call transcript here if available."></textarea>
    </div>

    <div class="field">
      <label>Evidence<span>MP3, WAV or PDF</span></label>
      <div class="drop" id="drop">
        <p><b>Drop recordings or transcripts here</b><br>or click to browse</p>
        <input type="file" id="file" accept=".mp3,.wav,.pdf" multiple hidden>
      </div>
      <div class="files" id="files"></div>
    </div>

    <div class="field row">
      <div style="grid-column:1/-1">
        <label for="cost">Lead cost</label>
        <div class="costrow">
          <div class="cost"><span>\$</span><input id="cost" inputmode="decimal" placeholder="45.00"></div>
          <button type="button" class="est" id="est">Estimate with AI</button>
        </div>
      </div>
    </div>

    <button class="go" id="go" disabled><span id="goTxt">Check &amp; build claim</span></button>
  </section>

  <section class="panel result" id="result" aria-live="polite"></section>
</main>
<div class="toast" id="toast"></div>

<script>
(()=>{
// Connected directly to your Render backend:
const API_ENDPOINT = 'https://leadclaw-api.onrender.com/api/dispute';

const PLATFORMS=['Angi','Thumbtack','Porch','Networx'];
const CHIPS=[
 ['Wrong number','Wrong number: the contact number on the lead was invalid or belonged to someone else. '],
 ['Disconnected','Phone was disconnected or out of service on every attempt. '],
 ['Outside service area','Customer is located outside our service area. '],
 ['Duplicate lead','This lead duplicates one already received. '],
 ['Spam or fake','Lead appears to be spam or a fake inquiry. '],
 ['Hired a competitor','Customer stated they already hired another contractor. ']
];
const POLICY={Angi:'Angi Lead Credit Policy',Thumbtack:'Thumbtack Lead Price Credit Terms',Porch:'Porch Pro Lead Guarantee',Networx:'Networx Lead Dispute Terms'};

const \$=id=>document.getElementById(id);
const st={platform:'Angi',files:[],tags:new Set(),claim:'',amount:0};
const money=n=>'\$'+(+n||0).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let toastT;function toast(m){const t=\$('toast');t.textContent=m;t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),2200)}

let total=parseFloat(localStorage.getItem('lc_total'))||0;
\$('total').textContent=money(total);

const pl=\$('platforms');
PLATFORMS.forEach(p=>{const b=document.createElement('button');b.type='button';b.textContent=p;b.setAttribute('role','radio');b.setAttribute('aria-checked',p===st.platform);
 b.onclick=()=>{st.platform=p;[...pl.children].forEach(x=>x.setAttribute('aria-checked',x===b))};pl.appendChild(b)});

CHIPS.forEach(([label,text])=>{const b=document.createElement('button');b.type='button';b.className='chip';b.textContent=label;b.setAttribute('aria-pressed','false');
 b.onclick=()=>{const n=\$('notes');const on=!st.tags.has(label);
  if(on){st.tags.add(label);n.value=(n.value&&!/\s\$/.test(n.value)?n.value+' ':n.value)+text}
  else{st.tags.delete(label);n.value=n.value.replace(text,'')}
  b.setAttribute('aria-pressed',on);n.focus();sync()};\$('chips').appendChild(b)});

const drop=$('drop'),fi=$('file');
drop.onclick=()=>fi.click();
drop.addEventListener('drop',e=>{e.preventDefault();addFiles(e.dataTransfer.files)});
drop.addEventListener('dragover',e=>e.preventDefault());
fi.onchange=()=>{addFiles(fi.files);fi.value=''};
function addFiles(list){[...list].forEach(f=>{if(!st.files.some(x=>x.name===f.name))st.files.push(f)});renderFiles();sync()}
function renderFiles(){const c=\$('files');c.innerHTML='';
 st.files.forEach((f,i)=>{const d=document.createElement('div');d.className='file';
  d.innerHTML=`<div class="ico">PDF</div><div class="nm">${esc(f.name)}</div><button>&times;</button>`;
  d.querySelector('button').onclick=()=>{st.files.splice(i,1);renderFiles();sync()};c.appendChild(d)})}

function sync(){\$('go').disabled=!($('notes').value.trim()\vert{}\vert{}$('transcript').value.trim()||st.files.length)}
$('notes').addEventListener('input',sync);$('transcript').addEventListener('input',sync);

const R=\$('result');
function empty(){R.innerHTML=`<div class="empty"><div class="ring">?</div><h3>Your claim shows up here</h3><p>Pick a platform, enter your refund reason, and run the check.</p></div>`}
function loading(){R.innerHTML=`<div class="steps"><div class="step on"><i>&#10003;</i>Connecting to AI Auditor...</div></div><div class="sk" style="width:92%"></div><div class="sk" style="width:80%"></div><p class="note">Please allow up to 50 seconds for Render to wake up.</p>`}

function render(r){
 const ok=r.valid;
 if(!ok){
  R.innerHTML=`<div class="verdict"><span class="badge no">&#10005; Not eligible for credit</span><span class="conf">confidence ${Math.round((r.confidence||.8)*100)}%</span></div>
  <div class="why"><b>${esc(POLICY[st.platform])}</b><br>${esc(r.reason)}</div>
  <div class="actions"><button class="btn" id="again">Edit and re-check</button></div>`;
  $('again').onclick=()=>{$('notes').focus();window.scrollTo({top:0,behavior:'smooth'});empty()};return}
 st.claim=r.claim;st.amount=r.amount||0;
 R.innerHTML=`<div class="verdict"><span class="badge ok">&#10003; Eligible: policy match</span><span class="conf">confidence ${Math.round((r.confidence||.9)*100)}%</span></div>
  <div class="facts"><div class="fact"><small>Platform</small><b>${st.platform}</b></div><div class="fact"><small>Credit at stake</small><b class="g">${money(st.amount)}</b></div><div class="fact"><small>Policy</small><b>${esc(POLICY[st.platform])}</b></div></div>
  <div class="claim">${esc(r.claim)}</div>
  <div class="actions"><button class="btn" id="copy">Copy claim</button><button class="btn primary" id="rec">Mark recovered</button></div>`;
 $('copy').onclick=copy;$('rec').onclick=recover}

async function copy(){try{await navigator.clipboard.writeText(st.claim)}catch(e){}toast('Claim copied to clipboard')}
function recover(){total+=st.amount;localStorage.setItem('lc_total',total);\$('total').textContent=money(total);toast('Added to recovered total');empty()}

\$('est').onclick=async()=>{
 const b=\$('est'),txt=($('notes').value+' '+$('transcript').value).trim();
 b.disabled=true;b.textContent='Estimating…';
 try{const x=await fetch(API_ENDPOINT.replace('/dispute','/dispute/estimate'),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({platform:st.platform,text:txt})});
  const res=await x.json();$('cost').value=res.amount.toFixed(2);}catch(e){$('cost').value='45.00'}
 b.disabled=false;b.textContent='Estimate with AI'};

\$('go').onclick=async()=>{
 const g=\$('go');g.disabled=true;loading();
 const cost=parseFloat(\$('cost').value)||45.00;
 
 try{
  const fd=new FormData();
  fd.append('platform',st.platform);
  fd.append('notes',\$('notes').value);
  fd.append('transcript',\$('transcript').value);
  fd.append('cost',cost);
  st.files.forEach(f=>fd.append('files',f));

  const r=await fetch(API_ENDPOINT,{method:'POST',body:fd});
  if(!r.ok)throw new Error('Server error');
  const j=await r.json();
  render(j);
 }catch(err){
  toast('Error connecting to backend API');
  empty();
 }
 g.disabled=false;
};

empty();
})();
</script>
</body>
</html>
