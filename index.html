<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LeadClaw | Contractor Lead Dispute Generator</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2220%22 fill=%22%2318181b%22/><text x=%2250%22 y=%2268%22 font-size=%2255%22 font-weight=%22bold%22 fill=%22white%22 text-anchor=%22middle%22 font-family=%22sans-serif%22>彡</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-base: #0b0f19;
      --bg-surface: #111827;
      --bg-card: #151d30;
      --border-color: #1f293d;
      --border-light: #2d3b55;
      --text-main: #f3f4f6;
      --text-sub: #9ca3af;
      --accent-blue: #3b82f6;
      --accent-blue-hover: #2563eb;
      --accent-green: #22c55e;
      --font-main: 'Inter', sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-base);
      color: var(--text-main);
      font-family: var(--font-main);
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      padding: 32px 16px;
    }

    .container {
      max-width: 800px;
      margin: 0 auto;
    }

    /* Header */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 20px;
      margin-bottom: 24px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 700;
      font-size: 1.2rem;
      letter-spacing: 0.5px;
      color: #ffffff;
    }

    .brand-icon {
      color: var(--accent-blue);
      font-size: 1.2rem;
    }

    .status-badge {
      background: rgba(34, 197, 94, 0.1);
      color: var(--accent-green);
      border: 1px solid rgba(34, 197, 94, 0.25);
      padding: 4px 12px;
      border-radius: 6px;
      font-size: 0.8rem;
      font-weight: 600;
    }

    /* Cards */
    .card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      padding: 20px;
      margin-bottom: 20px;
    }

    .stat-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .stat-title {
      font-size: 0.85rem;
      color: var(--text-sub);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      font-weight: 600;
    }

    .stat-value {
      font-size: 1.8rem;
      font-weight: 700;
      color: var(--accent-green);
      font-family: var(--font-mono);
    }

    .card-title {
      font-size: 0.95rem;
      font-weight: 600;
      margin-bottom: 16px;
      color: #ffffff;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* Calculator */
    .calc-sliders {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      margin-bottom: 16px;
    }

    @media (max-width: 600px) {
      .calc-sliders { grid-template-columns: 1fr; }
    }

    .slider-group label {
      display: block;
      font-size: 0.825rem;
      color: var(--text-sub);
      margin-bottom: 8px;
      font-weight: 500;
    }

    input[type="range"] {
      width: 100%;
      height: 5px;
      background: var(--border-color);
      border-radius: 5px;
      outline: none;
      accent-color: var(--accent-blue);
    }

    .calc-banner {
      background: var(--bg-surface);
      border: 1px dashed var(--border-light);
      border-radius: 6px;
      padding: 12px;
      text-align: center;
      font-size: 0.875rem;
      color: var(--text-main);
    }

    .calc-banner strong {
      color: var(--accent-green);
      font-weight: 700;
      font-family: var(--font-mono);
    }

    /* Platform Selector */
    .platform-selector {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      margin-bottom: 20px;
    }

    .btn-platform {
      background: var(--bg-surface);
      border: 1px solid var(--border-color);
      color: var(--text-sub);
      padding: 10px;
      border-radius: 6px;
      font-weight: 600;
      font-size: 0.85rem;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .btn-platform.active {
      background: var(--accent-blue);
      color: #ffffff;
      border-color: var(--accent-blue);
    }

    /* Form Fields */
    label.field-label {
      display: block;
      font-size: 0.825rem;
      color: var(--text-sub);
      margin-bottom: 6px;
      font-weight: 500;
    }

    textarea, input[type="text"] {
      width: 100%;
      background: var(--bg-surface);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      padding: 12px;
      color: var(--text-main);
      font-family: var(--font-main);
      font-size: 0.875rem;
      margin-bottom: 16px;
    }

    textarea:focus, input[type="text"]:focus {
      outline: none;
      border-color: var(--accent-blue);
    }

    .btn-submit {
      width: 100%;
      background: var(--accent-blue);
      color: #ffffff;
      border: none;
      padding: 12px;
      border-radius: 6px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
    }

    .btn-submit:hover {
      background: var(--accent-blue-hover);
    }

    /* Output Box */
    .output-box {
      background: var(--bg-surface);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      padding: 16px;
      min-height: 80px;
      font-size: 0.875rem;
      color: var(--text-sub);
      white-space: pre-wrap;
      font-family: var(--font-mono);
      margin-bottom: 16px;
    }

    .btn-copy {
      background: var(--bg-surface);
      border: 1px solid var(--border-light);
      color: var(--text-main);
      padding: 8px 16px;
      border-radius: 6px;
      font-size: 0.825rem;
      font-weight: 600;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <div class="brand">
        <span class="brand-icon">彡</span>
        <span>LEADCLAW</span>
      </div>
      <div class="status-badge">Engine Active</div>
    </header>

    <!-- Cash Stats -->
    <div class="card">
      <div class="stat-row">
        <div class="stat-title">Total Cash Recovered</div>
        <div class="stat-value" id="cashDisplay">$0.00</div>
      </div>
    </div>

    <!-- Savings Calculator -->
    <div class="card">
      <div class="card-title">💡 Monthly Dispute Savings Calculator</div>
      <div class="calc-sliders">
        <div class="slider-group">
          <label>Monthly Lead Spend: $<span id="spendVal">2000</span></label>
          <input type="range" id="spendRange" min="500" max="10000" step="250" value="2000" oninput="updateCalc()">
        </div>
        <div class="slider-group">
          <label>Estimated Junk Leads: <span id="junkVal">20</span>%</label>
          <input type="range" id="junkRange" min="5" max="50" step="5" value="20" oninput="updateCalc()">
        </div>
      </div>
      <div class="calc-banner">
        LeadClaw could recover approximately <strong id="potentialSavings">$400.00 / month</strong> in credits for your business.
      </div>
    </div>

    <!-- Input Section -->
    <div class="card">
      <div class="card-title">1. Dispute Input</div>
      
      <div class="platform-selector">
        <button class="btn-platform active" onclick="setPlatform(this, 'Angi')">Angi</button>
        <button class="btn-platform" onclick="setPlatform(this, 'Thumbtack')">Thumbtack</button>
        <button class="btn-platform" onclick="setPlatform(this, 'Porch')">Porch</button>
        <button class="btn-platform" onclick="setPlatform(this, 'Networx')">Networx</button>
      </div>

      <label class="field-label">Call Transcript / Recording Notes</label>
      <textarea id="notesInput" rows="4" placeholder="Paste notes or details here (e.g. 'Disconnected phone number')..."></textarea>

      <label class="field-label">Additional Context (Optional)</label>
      <input type="text" id="contextInput" placeholder="e.g. Attempted contact within 5 minutes">

      <button class="btn-submit" onclick="generateDispute()">Generate Claim</button>
    </div>

    <!-- Output Section -->
    <div class="card">
      <div class="card-title">2. Generated Statement</div>
      <div class="output-box" id="outputBox">Awaiting input...</div>
      <button class="btn-copy" onclick="copyStatement()" id="copyBtn">Copy Statement</button>
    </div>
  </div>

  <script>
    let selectedPlatform = 'Angi';

    function updateCalc() {
      const spend = document.getElementById('spendRange').value;
      const junk = document.getElementById('junkRange').value;
      document.getElementById('spendVal').innerText = spend;
      document.getElementById('junkVal').innerText = junk;
      
      const saved = (spend * (junk / 100)).toFixed(2);
      document.getElementById('potentialSavings').innerText = `$${saved} / month`;
    }

    function setPlatform(btn, name) {
      document.querySelectorAll('.btn-platform').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      selectedPlatform = name;
    }

    function generateDispute() {
      const notes = document.getElementById('notesInput').value.trim();
      const context = document.getElementById('contextInput').value.trim();

      if (!notes) {
        alert('Please enter call notes.');
        return;
      }

      const generatedText = `[${selectedPlatform.toUpperCase()} DISPUTE CLAIM]\nCategory: Invalid Lead Refund Request\nSummary: ${notes}\n${context ? 'Context: ' + context + '\n' : ''}Resolution Requested: Credit refund back to account per platform guidelines.`;

      document.getElementById('outputBox').innerText = generatedText;
    }

    function copyStatement() {
      const output = document.getElementById('outputBox').innerText;
      if (output && output !== 'Awaiting input...') {
        navigator.clipboard.writeText(output);
        const btn = document.getElementById('copyBtn');
        btn.innerText = 'Copied! ✓';
        setTimeout(() => btn.innerText = 'Copy Statement', 2000);
      }
    }
  </script>
</body>
</html>
