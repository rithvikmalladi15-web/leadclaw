<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LeadClaw</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            --font-mono: 'JetBrains Mono', monospace;
            
            --bg-body: #090a0f;
            --bg-card: #12151e;
            --bg-input: #0a0c12;
            --border: #1e2330;
            --border-focus: #3b82f6;
            
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --text-muted: #64748b;
            
            --accent-blue: #3b82f6;
            --accent-blue-hover: #2563eb;
            --accent-green: #10b981;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: var(--font-sans); -webkit-font-smoothing: antialiased; }
        body { background-color: var(--bg-body); color: var(--text-primary); padding: 40px 16px; min-height: 100vh; display: flex; justify-content: center; }
        .container { width: 100%; max-width: 680px; }

        /* Minimal Header */
        header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 32px; padding-bottom: 16px; border-bottom: 1px solid var(--border); }
        .brand { display: flex; align-items: center; gap: 10px; }
        .brand-name { font-weight: 700; font-size: 16px; letter-spacing: -0.3px; color: var(--text-primary); }
        .badge { background: #1e293b; color: var(--accent-blue); font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 6px; border: 1px solid #334155; }

        /* Simple Metric Bar */
        .metric-box { background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px; padding: 20px 24px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
        .metric-label { font-size: 12px; font-weight: 600; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.5px; }
        .metric-val { font-size: 28px; font-weight: 700; color: var(--accent-green); letter-spacing: -0.5px; }

        /* Card Panels */
        .card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px; padding: 24px; margin-bottom: 24px; }
        .card-label { font-size: 12px; font-weight: 600; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 16px; }

        /* Platform Selector Buttons */
        .platforms { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 20px; }
        @media(max-width: 500px) { .platforms { grid-template-columns: repeat(2, 1fr); } }
        .platform-btn { background: var(--bg-input); border: 1px solid var(--border); border-radius: 8px; padding: 10px; text-align: center; cursor: pointer; font-size: 13px; font-weight: 600; color: var(--text-secondary); transition: all 0.15s ease; }
        .platform-btn:hover { border-color: #334155; color: var(--text-primary); }
        .platform-btn.selected { background: var(--accent-blue); border-color: var(--accent-blue); color: #ffffff; }

        /* Inputs */
        .group { margin-bottom: 16px; }
        label { display: block; font-size: 12px; font-weight: 600; color: var(--text-secondary); margin-bottom: 6px; }
        textarea, input[type="text"] { width: 100%; padding: 12px; border: 1px solid var(--border); border-radius: 8px; font-size: 13px; background: var(--bg-input); color: var(--text-primary); transition: border-color 0.15s ease; }
        textarea:focus, input:focus { outline: none; border-color: var(--border-focus); }

        /* Action Buttons */
        .btn-primary { background: var(--accent-blue); color: #ffffff; border: none; border-radius: 8px; padding: 12px; font-size: 13px; font-weight: 600; width: 100%; cursor: pointer; transition: background 0.15s ease; }
        .btn-primary:hover { background: var(--accent-blue-hover); }
        
        .btn-secondary { background: transparent; color: var(--text-secondary); border: 1px solid var(--border); border-radius: 8px; padding: 10px; font-size: 13px; font-weight: 600; width: 100%; cursor: pointer; margin-top: 12px; transition: all 0.15s ease; }
        .btn-secondary:hover { border-color: #334155; color: var(--text-primary); }

        /* Terminal Output */
        .output-box { background: var(--bg-input); border: 1px solid var(--border); border-radius: 8px; padding: 16px; font-family: var(--font-mono); font-size: 12px; min-height: 140px; white-space: pre-wrap; line-height: 1.6; color: #38bdf8; }

        /* Simple Modal Overlay */
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.7); display: flex; justify-content: center; align-items: center; z-index: 100; backdrop-filter: blur(4px); }
        .modal { background: var(--bg-card); border: 1px solid var(--border); padding: 28px; border-radius: 12px; max-width: 400px; width: 90%; }
        .modal h2 { font-size: 16px; font-weight: 700; margin-bottom: 8px; }
        .modal p { font-size: 13px; color: var(--text-secondary); margin-bottom: 20px; line-height: 1.5; }
    </style>
</head>
<body>

<div class="modal-overlay" id="tutorialModal">
    <div class="modal">
        <h2>LeadClaw Setup</h2>
        <p>1. Select platform<br>2. Paste call details<br>3. Copy dispute claim</p>
        <button class="btn-primary" onclick="closeTutorial()">Got It</button>
    </div>
</div>

<div class="container">
    <header>
        <div class="brand">
            <svg width="22" height="22" viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M25 90Q32 45 55 15Q45 50 35 88Z" fill="#3b82f6"/>
                <path d="M50 95Q60 40 85 10Q75 48 65 92Z" fill="#3b82f6"/>
                <path d="M78 98Q90 45 110 25Q98 52 90 95Z" fill="#3b82f6"/>
            </svg>
            <div class="brand-name">LEADCLAW</div>
        </div>
        <span class="badge">Engine Active</span>
    </header>

    <div class="metric-box">
        <div class="metric-label">Total Cash Recovered</div>
        <div class="metric-val" id="totalRecovered">$0.00</div>
    </div>

    <div class="card">
        <div class="card-label">1. Dispute Input</div>
        
        <div class="platforms" id="platformSelector">
            <div class="platform-btn selected" onclick="selectPlatform('Angi')">Angi</div>
            <div class="platform-btn" onclick="selectPlatform('Thumbtack')">Thumbtack</div>
            <div class="platform-btn" onclick="selectPlatform('Porch')">Porch</div>
            <div class="platform-btn" onclick="selectPlatform('Networx')">Networx</div>
        </div>

        <div class="group">
            <label>Call Transcript / Recording Notes</label>
            <textarea id="leadTranscript" rows="4" placeholder="Paste notes or details here (e.g. 'Disconnected phone number')..."></textarea>
        </div>

        <div class="group">
            <label>Additional Context (Optional)</label>
            <input type="text" id="userNotes" placeholder="e.g. Attempted contact within 5 minutes">
        </div>

        <button class="btn-primary" onclick="generateDispute()">Generate Claim</button>
    </div>

    <div class="card">
        <div class="card-label">2. Generated Statement</div>
        <div class="output-box" id="outputStatement">Awaiting input...</div>
        <button class="btn-secondary" onclick="copyStatement()">Copy Statement</button>
    </div>
</div>

<script>
    let activePlatform = 'Angi';

    function closeTutorial() {
        document.getElementById('tutorialModal').style.display = 'none';
    }

    function selectPlatform(platform) {
        activePlatform = platform;
        document.querySelectorAll('.platform-btn').forEach(btn => {
            if(btn.innerText === platform) btn.classList.add('selected');
            else btn.classList.remove('selected');
        });
    }

    async function generateDispute() {
        const transcript = document.getElementById('leadTranscript').value;
        const notes = document.getElementById('userNotes').value;
        const outputBox = document.getElementById('outputStatement');

        if(!transcript) {
            alert('Please provide transcript or notes.');
            return;
        }

        outputBox.innerText = "Generating dispute statement...";

        try {
            const response = await fetch('https://leadclaw-api.onrender.com/api/generate', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ platform: activePlatform, transcript, notes })
            });
            const data = await response.json();
            
            if(data.statement) {
                outputBox.innerText = data.statement;

                const match = data.statement.match(/\$(\d+\.\d{2})/);
                const estimatedVal = match ? parseFloat(match[1]) : 75.00;

                const totalEl = document.getElementById('totalRecovered');
                let currentTotal = parseFloat(totalEl.innerText.replace('$', '').replace(',', ''));
                currentTotal += estimatedVal;
                totalEl.innerText = '$' + currentTotal.toFixed(2);
            } else {
                outputBox.innerText = "Error: " + data.error;
            }
        } catch (e) {
            outputBox.innerText = "Connection error. Ensure server is running.";
        }
    }

    function copyStatement() {
        const text = document.getElementById('outputStatement').innerText;
        if(text.startsWith('Awaiting input') || text.startsWith('Generating')) {
            alert('Please generate a statement first.');
            return;
        }
        navigator.clipboard.writeText(text);
        alert('Dispute statement copied to clipboard!');
    }
</script>

</body>
</html>
