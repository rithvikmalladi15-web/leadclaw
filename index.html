<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LeadClaw | Contractor Lead Dispute Generator</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2220%22 fill=%22%2318181b%22/><text x=%2250%22 y=%2268%22 font-size=%2255%22 font-weight=%22bold%22 fill=%22white%22 text-anchor=%22middle%22 font-family=%22sans-serif%22>彡</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-base: #0b0f19;
      --bg-surface: #111827;
      --bg-card: #151d30;
      --border-color: #1f293d;
      --border-light: #2d3b55;
      --text-main: #f3f4f6;
      --text-sub: #9ca3af;
      --accent-blue: #3b82f6;
      --accent-blue-hover: #2563eb;
      --accent-green: #22c55e;
      --font-main: 'Inter', sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--bg-base);
      color: var(--text-main);
      font-family: var(--font-main);
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      padding: 32px 16px;
    }

    .container { max-width: 800px; margin: 0 auto; }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 20px;
      margin-bottom: 24px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 700;
      font-size: 1.2rem;
      letter-spacing: 0.5px;
      color: #ffffff;
    }

    .brand-icon { color: var(--accent-blue); font-size: 1.2rem; }

    .status-badge {
      background: rgba(34, 197, 94, 0.1);
      color: var(--accent-green);
      border: 1px solid rgba(34, 197, 94, 0.25);
      padding: 4px 12px;
      border-radius: 6px;
      font-size: 0.8rem;
      font-weight: 600;
    }

    .card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      padding: 20px;
      margin-bottom: 20px;
    }

    .stat-row { display: flex; justify-content: space-between; align-items: center; }

    .stat-title {
      font-size: 0.85rem;
      color: var(--text-sub);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      font-weight: 600;
    }

    .stat-value {
      font-size: 1.8rem;
      font-weight: 700;
      color: var(--accent-green);
      font-family: var(--font-mono);
    }

    .card-title {
      font-size: 0.95rem;
      font-weight: 600;
      margin-bottom: 16px;
      color: #ffffff;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .platform-selector {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      margin-bottom: 20px;
    }

    .btn-platform {
      background: var(--bg-surface);
      border: 1px solid var(--border-color);
      color: var(--text-sub);
      padding: 10px;
      border-radius: 6px;
      font-weight: 600;
      font-size: 0.85rem;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .btn-platform.active {
      background: var(--accent-blue);
      color: #ffffff;
      border-color: var(--accent-blue);
    }

    /* Quick Options Chips */
    .chips-group {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 16px;
    }

    .chip {
      background: var(--bg-surface);
      border: 1px solid var(--border-color);
      color: var(--text-sub);
      font-size: 0.78rem;
      padding: 6px 12px;
      border-radius: 16px;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .chip:hover {
      border-color: var(--accent-blue);
      color: var(--text-main);
    }

    label.field-label {
      display: block;
      font-size: 0.825rem;
      color: var(--text-sub);
      margin-bottom: 6px;
      font-weight: 500;
    }

    textarea, input[type="text"] {
      width: 100%;
      background: var(--bg-surface);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      padding: 12px;
      color: var(--text-main);
      font-family: var(--font-main);
      font-size: 0.875rem;
      margin-bottom: 16px;
    }

    textarea:focus, input[type="text"]:focus {
      outline: none;
      border-color: var(--accent-blue);
    }

    .btn-submit {
      width: 100%;
      background: var(--accent-blue);
      color: #ffffff;
      border: none;
      padding: 12px;
      border-radius: 6px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
    }

    .btn-submit:hover { background: var(--accent-blue-hover); }

    .output-box {
      background: var(--bg-surface);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      padding: 16px;
      min-height: 80px;
      font-size: 0.875rem;
      color: var(--text-sub);
      white-space: pre-wrap;
      font-family: var(--font-mono);
      margin-bottom: 16px;
    }

    .warning-box {
      background: rgba(239, 68, 68, 0.1);
      border: 1px solid rgba(239, 68, 68, 0.3);
      color: #fca5a5;
      padding: 14px;
      border-radius: 6px;
      font-size: 0.85rem;
      margin-bottom: 16px;
      display: none;
    }

    .btn-copy {
      background: var(--bg-surface);
      border: 1px solid var(--border-light);
      color: var(--text-main);
      padding: 8px 16px;
      border-radius: 6px;
      font-size: 0.825rem;
      font-weight: 600;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <div class="brand">
        <span class="brand-icon">彡</span>
        <span>LEADCLAW</span>
      </div>
      <div class="status-badge">Engine Active</div>
    </header>

    <!-- Cash Recovered Calculator / Stat Tracker -->
    <div class="card">
      <div class="stat-row">
        <div class="stat-title">Total Cash Recovered</div>
        <div class="stat-value" id="cashDisplay">$0.00</div>
      </div>
    </div>

    <div class="card">
      <div class="card-title">1. Dispute Input</div>
      
      <div class="platform-selector">
        <button class="btn-platform active" onclick="setPlatform(this, 'Angi')">Angi</button>
        <button class="btn-platform" onclick="setPlatform(this, 'Thumbtack')">Thumbtack</button>
        <button class="btn-platform" onclick="setPlatform(this, 'Porch')">Porch</button>
        <button class="btn-platform" onclick="setPlatform(this, 'Networx')">Networx</button>
      </div>

      <!-- Quick Options Chips -->
      <label class="field-label">Quick Options:</label>
      <div class="chips-group">
        <div class="chip" onclick="applyQuickOption('Disconnected phone number / number invalid')">Disconnected Phone</div>
        <div class="chip" onclick="applyQuickOption('Homeowner is outside my designated zip code area')">Out of Service Area</div>
        <div class="chip" onclick="applyQuickOption('Duplicate lead received twice within 24 hours')">Duplicate Lead</div>
        <div class="chip" onclick="applyQuickOption('Spam / bot lead with fake email and name')">Spam / Bot Lead</div>
      </div>

      <label class="field-label">Call Transcript / Recording Notes</label>
      <textarea id="notesInput" rows="4" placeholder="Paste notes or details here (e.g. 'Disconnected phone number')..."></textarea>

      <label class="field-label">Additional Context (Optional)</label>
      <input type="text" id="contextInput" placeholder="e.g. Attempted contact within 5 minutes">

      <button class="btn-submit" onclick="generateDispute()" id="submitBtn">Generate Claim</button>
    </div>

    <div class="card">
      <div class="card-title">2. Generated Statement</div>
      <div class="warning-box" id="warningBox"></div>
      <div class="output-box" id="outputBox">Awaiting input...</div>
      <button class="btn-copy" onclick="copyStatement()" id="copyBtn">Copy Statement</button>
    </div>
  </div>

  <script>
    let selectedPlatform = 'Angi';
    let totalRecovered = 0.00;
    const avgLeadCost = 45.00; // Estimated calculator value per successful claim

    // Replace URL below with your Render Python API deployment URL
    const API_URL = 'https://your-api-url.onrender.com/api/dispute'; 

    function setPlatform(btn, name) {
      document.querySelectorAll('.btn-platform').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      selectedPlatform = name;
    }

    function applyQuickOption(text) {
      document.getElementById('notesInput').value = text;
    }

    async function generateDispute() {
      const notes = document.getElementById('notesInput').value.trim();
      const context = document.getElementById('contextInput').value.trim();
      const warningBox = document.getElementById('warningBox');
      const outputBox = document.getElementById('outputBox');
      const submitBtn = document.getElementById('submitBtn');

      if (!notes) {
        alert('Please enter call notes or select a quick option.');
        return;
      }

      submitBtn.innerText = 'Evaluating Policy Criteria...';
      submitBtn.disabled = true;

      try {
        const response = await fetch(API_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ platform: selectedPlatform, notes: notes, context: context })
        });

        const data = await response.json();

        if (data.valid === false) {
          warningBox.style.display = 'block';
          warningBox.innerHTML = `<strong>NON-REFUNDABLE REASON DETECTED (${selectedPlatform.toUpperCase()})</strong><br>${data.reason}`;
          outputBox.innerText = `[DISPUTE BLOCKED]\nReason: Input does not satisfy ${selectedPlatform}'s official refund requirements.`;
        } else {
          warningBox.style.display = 'none';
          outputBox.innerText = data.statement;

          // Increment calculator / total cash recovered on valid claims
          totalRecovered += avgLeadCost;
          document.getElementById('cashDisplay').innerText = '$' + totalRecovered.toFixed(2);
        }
      } catch (err) {
        alert('Error connecting to engine API.');
      } finally {
        submitBtn.innerText = 'Generate Claim';
        submitBtn.disabled = false;
      }
    }

    function copyStatement() {
      const output = document.getElementById('outputBox').innerText;
      if (output && output !== 'Awaiting input...' && !output.includes('[DISPUTE BLOCKED]')) {
        navigator.clipboard.writeText(output);
        const btn = document.getElementById('copyBtn');
        btn.innerText = 'Copied';
        setTimeout(() => btn.innerText = 'Copy Statement', 2000);
      }
    }
  </script>
</body>
</html>
